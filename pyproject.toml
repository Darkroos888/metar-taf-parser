[project]
name = "metar-taf-parser"
version = "0.1.0"
description = "Parser de nomenclatura METAR/TAF, escrito en Python puro"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Lucciano", email = "luccianosileo2003@gmail.com" },
    { name = "Joaquin", email = "rayadomenjonj@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "pdoc>=14.0",
]

[project.urls]
Homepage = "https://github.com/Darkroos888/metar-taf-parser.git"
Issues = "https://github.com/Darkroos888/metar-taf-parser.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metar_taf_parser"]

# ---------- RUFF ----------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes/pycodestyle básicos
    "I",             # isort (orden de imports)
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear (errores comunes)
    "C4",            # comprehensions
    "SIM",           # simplificaciones
    "D",             # pydocstyle (docstrings, útil de cara a pdoc)
]
ignore = [
    "D203",  # conflicto con D211
    "D213",  # conflicto con D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------- PYTEST ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=metar_taf_parser --cov-report=term-missing"

[tool.coverage.run]
source = ["src/metar_taf_parser"]
